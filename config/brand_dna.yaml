# Brand DNA Configuration for Ornamental Fish TikTok Channel
brand_name: "Aquatic Minimalist (ร้านปลาสวยงาม สไตล์มินิมอล)"
niche: "ปลาสวยงาม, ไม้น้ำ, ตู้ปลาดีไซน์มินิมอล, การดูแลระบบนิเวศน์ในตู้ปลา"
target_audience:
  primary: "คนเลี้ยงปลามือใหม่ และคนชอบแต่งโต๊ะทำงาน/แต่งห้องด้วยตู้ปลามินิมอล"
  secondary: "ผู้เลี้ยงปลาสายพันธุ์เฉพาะ (เช่น ปลากัด, นีออน, กุ้งแคระ, ปลาทอง, ปลาเทวดา)"
  pain_points:
    - "ซื้อปลามาเลี้ยงแล้วตายใน 3-7 วัน (ไม่เข้าใจระบบไนโตรเจน)"
    - "น้ำขุ่นเร็ว ตะไคร่ขึ้นเต็มตู้ ล้างตู้เหนื่อย"
    - "ไม่รู้ว่าปลาชนิดไหนเลี้ยงรวมกันได้บ้าง"
    - "อยากจัดตู้ปลาสไตล์ Minimal Zen แต่งบ้าน แต่ไม่รู้เริ่มยังไง"
    - "ปลาไม่ยอมว่ายรวมฝูง หรือมีพฤติกรรมผิดปกติ"

tone_of_voice:
  personality: "ผู้เชี่ยวชาญที่เล่าเรื่องเก่ง สงบนิ่ง สบายตา น่าเชื่อถือ เข้าใจง่าย"
  pacing: "กระชับ ไม่เยิ่นเย้อ ภายใน 3 วินาทีแรกต้องมีจุดดึงดูดสายตา"
  language: "ภาษาไทยพูดธรรมชาติ มีคำถามเปิดท้ายให้คนอยากแชร์ประสบการณ์"

content_pillars:
  - id: "mythbuster"
    name: "3D Mythbuster & Quick Fixes"
    description: "ผ่าโครงสร้างตู้ปลา 3D ไขข้อข้องใจที่คนเลี้ยงปลาเข้าใจผิดบ่อยๆ"
  - id: "aquascape_design"
    name: "3D Minimal Aquascape Setup"
    description: "จำลองขั้นตอนการจัดตู้ปลาสวยงามสไตล์มินิมอลแบบ Step-by-Step สบายตา"
  - id: "species_anatomy"
    name: "Micro-Behavior & Species Spotlight"
    description: "เจาะลึกพฤติกรรมและจุดเด่นของปลาแต่ละสายพันธุ์ในมุมมอง 3D สวยคลีน"
  - id: "interactive_quiz"
    name: "3D Interactive Quiz & Curiosity"
    description: "ตั้งโจทย์/สถานการณ์จำลอง 3D เพื่อกระตุ้นให้คนคอมเมนต์ทายคำตอบ"
